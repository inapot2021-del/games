<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#151a12">
<title>徴兵令 Ver.0.18.4</title>
<style>
:root{
  --bg:#10140e; --case:#2a3126; --lcd:#d9e0bf; --ink:#182116;
  --green:#446b2f; --green2:#5f843f; --dark:#1e3317; --red:#81362a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Courier New",monospace;overscroll-behavior:none}
body{display:flex;justify-content:center;align-items:flex-start;padding:max(8px,env(safe-area-inset-top)) 8px max(10px,env(safe-area-inset-bottom));touch-action:none}
.app{width:min(98vw,560px)}
.case{background:linear-gradient(#374032,#242a21);border:2px solid #59634f;border-radius:24px;padding:12px;box-shadow:0 14px 42px #0009}
.screen{position:relative;background:var(--lcd);border:6px inset #68725e;border-radius:9px;padding:8px;color:var(--ink)}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin:0 2px 6px}
.logo{font-size:clamp(22px,7vw,34px);font-weight:1000;letter-spacing:.12em}
.ver{font-size:10px;opacity:.65}
.stats{font-size:11px;line-height:1.45;text-align:right;font-weight:900}
.boardWrap{position:relative}
canvas{width:100%;aspect-ratio:1;display:block;background:#dce4c7;border:2px solid #34402d;image-rendering:pixelated}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#192215e8;color:#edf3dc;text-align:center;padding:20px;z-index:4}
.overlay.hidden{display:none}
.overlay .big{font-size:clamp(27px,8vw,44px);font-weight:1000;letter-spacing:.08em}
.overlay .small{font-size:13px;line-height:1.7;margin-top:12px;font-weight:800}
.rankbox{width:min(88%,340px);margin-top:14px;text-align:left;border:2px solid #899579;padding:10px;background:#dbe3c8;color:#182116}
.rankrow{display:grid;grid-template-columns:46px 1fr 64px 48px;gap:6px;padding:5px 2px;border-bottom:1px dashed #7b876c;align-items:center}
.rankrow:last-child{border-bottom:0}


.rankrow span:last-child{text-align:center;font-weight:1000}25%{opacity:1;transform:scale(1.18)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}

.heymini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:3;font-size:28px;font-weight:1000;letter-spacing:.05em;color:#f4f6db;text-shadow:2px 2px 0 #355126;opacity:0;transform:scale(.75)}
.heymini.pop{animation:heyMiniPop .34s ease-out}
@keyframes heyMiniPop{0%{opacity:0;transform:scale(.65)}20%{opacity:1;transform:scale(1.08)}65%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(.92)}}

.controls{margin:12px auto 3px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.btn{appearance:none;border:0;border-radius:10px;background:#515b4b;color:#fff;min-height:52px;font-size:20px;font-weight:1000;box-shadow:inset 0 -4px #343b30;touch-action:manipulation;user-select:none}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px #343b30}
.dirgrid{grid-column:1/5;display:grid;grid-template-columns:repeat(3,72px);grid-template-rows:repeat(2,54px);gap:7px;justify-content:center}
.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
.smallbtn{font-size:12px;letter-spacing:.04em}

.dpad{width:174px;height:174px;margin:8px auto 6px;
  display:grid;
  grid-template-columns:58px 58px 58px;
  grid-template-rows:58px 58px 58px;
  grid-template-areas:". up ." "left pause right" ". down .";
  touch-action:none;user-select:none;-webkit-user-select:none
}
.dpad-btn{
  appearance:none;width:58px;height:58px;margin:0;padding:0;
  border:2px solid #26381f;background:#5d754d;color:#f0f3dc;
  font-size:25px;font-weight:1000;line-height:1;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 3px 0 #26381f;
  touch-action:none
}
.dpad-btn:active,.dpad-btn.pressed{
  transform:translateY(2px) scale(.97);
  background:#718b60;
  box-shadow:inset 0 3px 6px rgba(0,0,0,.28),0 1px 0 #26381f
}
.dpad .up{grid-area:up;border-radius:14px 14px 4px 4px}
.dpad .left{grid-area:left;border-radius:14px 4px 4px 14px}
.dpad .right{grid-area:right;border-radius:4px 14px 14px 4px}
.dpad .down{grid-area:down;border-radius:4px 4px 14px 14px}
.dpad .pause{grid-area:pause;border-radius:5px;background:#394d32;font-size:19px}
.utility-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:0 auto 4px}
.utility-btn{
  appearance:none;border:0;border-radius:10px;background:#515b4b;color:#fff;
  min-height:44px;font-size:12px;font-weight:1000;box-shadow:inset 0 -4px #343b30;
  touch-action:manipulation
}
.utility-btn:active{transform:translateY(2px);box-shadow:inset 0 -2px #343b30}

</style>
</head>
<body>
<div class="app">
  <div class="case">
    <div class="screen">
      <div class="top">
        <div><div class="logo">徴兵令</div><div class="ver">Ver.0.18.4</div></div>
        <div class="stats">
          LEVEL <span id="level">1</span><br>
          SOLDIERS <span id="count">1</span><br>
          SCORE <span id="score">0</span>
        </div>
      </div>

      <div class="boardWrap">
        <canvas id="game" width="600" height="600"></canvas>
        <div class="heymini" id="heymini">HEY!</div>
<div class="overlay" id="overlay">
          <div class="big" id="overlayTitle">TAP TO START</div>
          <div class="small" id="overlayText"></div>
          <div class="rankbox" id="rankbox" style="display:none"></div>
        </div>
      </div>
    </div>

    <div class="dpad" id="dpad">
      <button class="dpad-btn up" data-dir="up" aria-label="up">▲</button>
      <button class="dpad-btn left" data-dir="left" aria-label="left">◀</button>
      <button class="dpad-btn pause" id="pause" aria-label="pause">Ⅱ</button>
      <button class="dpad-btn right" data-dir="right" aria-label="right">▶</button>
      <button class="dpad-btn down" data-dir="down" aria-label="down">▼</button>
    </div>
    <div class="utility-row">
      <button class="utility-btn" id="sound">♪ ON</button>
      <button class="utility-btn" id="ranking">RANKING</button>
      <button class="utility-btn" id="restart">RESTART</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

const N = 12;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const levelEl = document.getElementById('level');
const countEl = document.getElementById('count');
const scoreEl = document.getElementById('score');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayText = document.getElementById('overlayText');
const rankbox = document.getElementById('rankbox');
const soundBtn = document.getElementById('sound');
const pauseBtn = document.getElementById('pause');
const heyMini = document.getElementById('heymini');

let soldiers=[{x:6,y:6}], recruit={x:9,y:6};
let dir={x:1,y:0}, queuedDir={x:1,y:0};
let turnQueue=[];
let collisionPending=false;
let collisionTimer=null;
const TURN_GRACE_MS=180;
let running=false, paused=false, timer=null, score=0, level=1, soundOn=true;
let audioCtx=null, stepCount=0, showingRanking=false;

let prevSoldiers = soldiers.map(s=>({...s}));
let animationStart = performance.now();
let animationDuration = 350;
let pauseProgress = 1;

let gameStartedAt = 0;
let pausedAt = 0;
let totalPausedMs = 0;
const SCORE_KEY='choheirei_scores_v09';

function gameSpeed(){
  return Math.max(90, 350 - (level-1)*25);
}

function audioReady(){
  if(!soundOn) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(AC){
    if(!audioCtx) audioCtx=new AC();
    if(audioCtx.state==='suspended') audioCtx.resume();
  }
  unlockHey();
}

function tone(freq,duration=.05,type='square',gain=.03,when=0){
  if(!soundOn||!audioCtx) return;
  const t=audioCtx.currentTime+when;
  const osc=audioCtx.createOscillator();
  const amp=audioCtx.createGain();
  osc.type=type;
  osc.frequency.setValueAtTime(freq,t);
  amp.gain.setValueAtTime(gain,t);
  amp.gain.exponentialRampToValueAtTime(.001,t+duration);
  osc.connect(amp); amp.connect(audioCtx.destination);
  osc.start(t); osc.stop(t+duration);
}

function noiseBurst(duration=.04,gain=.02,filterFreq=1800){
  if(!soundOn||!audioCtx) return;
  const length=Math.floor(audioCtx.sampleRate*duration);
  const buffer=audioCtx.createBuffer(1,length,audioCtx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<length;i++) data[i]=(Math.random()*2-1)*(1-i/length);
  const src=audioCtx.createBufferSource();
  const filter=audioCtx.createBiquadFilter();
  const amp=audioCtx.createGain();
  filter.type='bandpass'; filter.frequency.value=filterFreq; filter.Q.value=1.2;
  amp.gain.value=gain;
  src.buffer=buffer; src.connect(filter); filter.connect(amp); amp.connect(audioCtx.destination);
  src.start();
}


let technoTimer=null;
let technoStep=0;

function technoInterval(){
  // march-like 124 BPM, 8th-note pulse
  return 60000/128/2;
}

function technoPulse(){
  if(!soundOn || !audioCtx || audioCtx.state!=='running') return;
  const s=technoStep%16;

  // Brighter marching four-on-the-floor
  if(s%4===0){
    tone(62,.11,'sine',.086);
    tone(110,.04,'triangle',.032);
  }

  // crisp hats / marching clicks
  if(s%4===2) noiseBurst(.035,.020,3800);
  if(s%2===1) noiseBurst(.022,.012,2300);

  // hypnotic bass - slightly brighter than before
  const bass=[110,110,123.47,110,164.81,123.47,146.83,98];
  tone(bass[s%8],.070,'square',.016,.006);

  // tiny melodic hook every other eighth-note
  const melody=[659.25,0,739.99,0,830.61,0,739.99,0,659.25,0,587.33,0,659.25,0,493.88,0];
  const note=melody[s];
  if(note){
    tone(note,.075,'triangle',.014,.012);
    // faint octave sparkle for addictive arcade feel
    if(s===4 || s===12) tone(note*2,.035,'sine',.006,.018);
  }

  technoStep++;
}

function startTechno(){
  if(technoTimer) clearInterval(technoTimer);
  technoStep=0;
  if(!soundOn) return;
  audioReady();
  technoPulse();
  technoTimer=setInterval(technoPulse,technoInterval());
}

function stopTechno(){
  if(technoTimer){ clearInterval(technoTimer); technoTimer=null; }
}

function marchBeat(){
  if(!soundOn||!audioCtx) return;
  // subtle marching footstep; the techno loop itself runs independently
  if(stepCount%2===0) tone(72,.025,'sine',.012);
  stepCount++;
}

yoAudio.preload = 'auto';
heyAudio.preload = 'auto';
let heyUnlocked = false;

function unlockHey(){
  if(heyUnlocked) return;
  try{
    yoAudio.muted = true;
    yoAudio.volume = 0;
    const yp = yoAudio.play();
    if(yp && yp.then){
      yp.then(()=>{ yoAudio.pause(); yoAudio.currentTime=0; yoAudio.muted=false; yoAudio.volume=0.38; }).catch(()=>{});
    }else{
      yoAudio.pause(); yoAudio.currentTime=0; yoAudio.muted=false; yoAudio.volume=0.38;
    }
  }catch(e){}
  try{
    heyAudio.muted = true;
    heyAudio.volume = 0;
    const p = heyAudio.play();
    if(p && p.then){
      p.then(()=>{
        heyAudio.pause();
        heyAudio.currentTime = 0;
        heyAudio.volume = 0.42;
        heyUnlocked = true;
      }).catch(()=>{});
    } else {
      heyAudio.pause();
      heyAudio.currentTime = 0;
      heyAudio.volume = 0.42;
      heyUnlocked = true;
    }
  }catch(e){}
}

function heySound(){
  if(!soundOn) return;
  try{
    heyAudio.pause();
    heyAudio.currentTime = 0;
    heyAudio.muted = false;
    heyAudio.volume = 0.42;
    const p = heyAudio.play();
    if(p && p.catch) p.catch(()=>{
      audioReady();
      tone(420,.055,'sawtooth',.04);
      tone(620,.08,'square',.035,.05);
    });
  }catch(e){
    audioReady();
    tone(420,.055,'sawtooth',.04);
    tone(620,.08,'square',.035,.05);
  }
}


function popHeyMini(text='HEY!'){
  heyMini.textContent=text;
  heyMini.classList.remove('pop');
  void heyMini.offsetWidth;
  heyMini.classList.add('pop');
}


function yoSound(){
  if(!soundOn) return;
  try{
    yoAudio.pause();
    yoAudio.currentTime=0;
    yoAudio.muted=false;
    yoAudio.volume=0.38;
    const p=yoAudio.play();
    if(p && p.catch) p.catch(()=>{});
  }catch(e){}
}


function crashSound(){
  tone(85,.24,'sawtooth',.05);
  tone(55,.36,'square',.035,.08);
}


function randomFreeCell(){
  const used=new Set(soldiers.map(s=>s.x+','+s.y));
  const free=[];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(!used.has(x+','+y)) free.push({x,y});
  return free[Math.floor(Math.random()*free.length)];
}


function elapsedGameMs(){
  if(!gameStartedAt) return 0;
  const now = paused && pausedAt ? pausedAt : performance.now();
  return Math.max(0, now - gameStartedAt - totalPausedMs);
}

function formatTime(ms){
  const total = Math.floor(ms/1000);
  const min = Math.floor(total/60);
  const sec = total%60;
  return String(min).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function resetGame(){
  clearTimeout(timer);
  audioReady();
  soldiers=[{x:6,y:6}];
  prevSoldiers=soldiers.map(s=>({...s}));
  dir={x:1,y:0}; queuedDir={x:1,y:0};
  turnQueue=[];
  collisionPending=false;
  if(collisionTimer){ clearTimeout(collisionTimer); collisionTimer=null; }
  recruit=randomFreeCell();
  score=0; level=1; stepCount=0; paused=false; running=true; showingRanking=false;
  pauseProgress=1;
  gameStartedAt=performance.now();
  pausedAt=0;
  totalPausedMs=0;
  pauseBtn.textContent='Ⅱ';
  rankbox.style.display='none';
  overlay.classList.add('hidden');
  updateHud();
  animationDuration=gameSpeed();
  draw();
  startTechno();
  timer=setTimeout(tick,40);
}

function schedule(delay=null){
  clearTimeout(timer);
  if(running&&!paused){
    const d = delay===null ? animationDuration : delay;
    timer=setTimeout(tick, Math.max(0,d));
  }
}

function tick(){
  prevSoldiers=soldiers.map(s=>({...s}));

  // Consume one buffered turn per cell.
  if(turnQueue.length){
    dir=turnQueue.shift();
    queuedDir=turnQueue.length ? turnQueue[turnQueue.length-1] : dir;
  }else{
    dir=queuedDir;
  }

  const h=soldiers[0];
  const next={x:h.x+dir.x,y:h.y+dir.y};
  const hitWall=next.x<0||next.x>=N||next.y<0||next.y>=N;
  const hitSelf=soldiers.some((s,i)=>i>0&&s.x===next.x&&s.y===next.y);

  if(hitWall||hitSelf){
    // Give the player a tiny last-second turn window instead of instant death.
    collisionPending=true;
    clearTimeout(timer);
    if(collisionTimer) clearTimeout(collisionTimer);
    collisionTimer=setTimeout(()=>{
      collisionPending=false;
      collisionTimer=null;
      gameOver();
    },TURN_GRACE_MS);
    return;
  }

  collisionPending=false;
  if(collisionTimer){ clearTimeout(collisionTimer); collisionTimer=null; }

  soldiers.unshift(next);
  const got=recruit&&next.x===recruit.x&&next.y===recruit.y;

  if(got){
    score+=100*level;
    level=1+Math.floor((soldiers.length-1)/5);
    recruit=randomFreeCell();
    if(soldiers.length % 5 === 0){
      yoSound(); popHeyMini('YO!');
    }else{
      heySound(); popHeyMini('HEY!');
    }
  }else{
    soldiers.pop();
    score+=1;
  }

  marchBeat();
  updateHud();

  animationDuration=gameSpeed();
  animationStart=performance.now();
  pauseProgress=0;
  schedule(animationDuration);
}

function saveScore(entry){
  let scores=[];
  try{ scores=JSON.parse(localStorage.getItem(SCORE_KEY)||'[]'); }catch(e){}
  if(!Array.isArray(scores)) scores=[];
  scores.push(entry);
  scores=scores
    .filter(x=>x && Number.isFinite(x.score))
    .sort((a,b)=>b.score-a.score || b.soldiers-a.soldiers || a.timeMs-b.timeMs)
    .slice(0,10);
  localStorage.setItem(SCORE_KEY,JSON.stringify(scores));
}

function getScores(){
  try{
    const s=JSON.parse(localStorage.getItem(SCORE_KEY)||'[]');
    return Array.isArray(s)?s:[];
  }catch(e){return [];}
}


function gameSoldierIconDataURL(){
  const oldCanvas=canvas;
  // Render using the same soldier artwork into a temporary 80px canvas.
  const temp=document.createElement('canvas');
  temp.width=80; temp.height=80;
  const tctx=temp.getContext('2d');

  // drawArmyMan uses global ctx/canvas, so reproduce it by temporarily drawing
  // onto the main canvas and copying the exact rendered cell.
  const snap=document.createElement('canvas');
  snap.width=canvas.width; snap.height=canvas.height;
  snap.getContext('2d').drawImage(canvas,0,0);

  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawArmyMan(0,0,false,false);
  const cell=canvas.width/N;
  tctx.drawImage(canvas,0,0,cell,cell,0,0,80,80);

  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(snap,0,0);
  return temp.toDataURL('image/png');
}

function renderRanking(){
  const scores=getScores();
  const soldierIcon=gameSoldierIconDataURL();
  rankbox.innerHTML=
    '<div class="rankrow" style="font-weight:1000">'+
    '<span>RANK</span><span>SCORE</span><span>TIME</span><span aria-label="soldiers">♟</span></div>';

  for(let i=0;i<10;i++){
    const row=document.createElement('div');
    row.className='rankrow';
    row.style.display='grid';
    row.style.gridTemplateColumns='46px 1fr 64px 48px';
    row.style.gap='6px';

    const x=scores[i];
    if(x){
      row.innerHTML=
        '<span>'+(i+1)+'.</span>'+
        '<strong>'+x.score+'</strong>'+
        '<span>'+formatTime(x.timeMs||0)+'</span>'+
        '<span>'+x.soldiers+'</span>';
    }else{
      row.innerHTML='<span>'+(i+1)+'.</span><span>---</span><span>--:--</span><span>--</span>';
    }
    rankbox.appendChild(row);
  }
}

function gameOver(){
  if(collisionTimer){ clearTimeout(collisionTimer); collisionTimer=null; }
  collisionPending=false;
  running=false; paused=false; clearTimeout(timer); stopTechno();
  const finalTimeMs=elapsedGameMs();
  crashSound();
  saveScore({score:score, soldiers:soldiers.length, timeMs:finalTimeMs});
  overlayTitle.textContent='GAME OVER';
  overlayText.innerHTML='SCORE '+score+'<br>TIME '+formatTime(finalTimeMs)+'<br>SOLDIERS '+soldiers.length;
  rankbox.style.display='none';
  overlay.classList.remove('hidden');
  draw(true);
}

function currentAnimProgress(){
  if(pauseProgress>=0 && paused) return pauseProgress;
  if(animationDuration<=0) return 1;
  return Math.max(0,Math.min(1,(performance.now()-animationStart)/animationDuration));
}

function togglePause(){
  if(!running) return;
  if(collisionTimer){ clearTimeout(collisionTimer); collisionTimer=null; }
  collisionPending=false;
  if(!paused){
    pauseProgress=currentAnimProgress();
    paused=true;
    pausedAt=performance.now();
    clearTimeout(timer);
    stopTechno();
    pauseBtn.textContent='▶';
    overlayTitle.textContent='PAUSE';
    overlayText.textContent='';
    rankbox.style.display='none';
    overlay.classList.remove('hidden');
  }else{
    if(pausedAt){
      totalPausedMs += performance.now()-pausedAt;
      pausedAt=0;
    }
    paused=false;
    pauseBtn.textContent='Ⅱ';
    overlay.classList.add('hidden');
    startTechno();
    const remaining=Math.max(0, animationDuration*(1-pauseProgress));
    animationStart=performance.now()-pauseProgress*animationDuration;
    schedule(remaining);
  }
}

function showRanking(){
  showingRanking=true;
  if(running&&!paused){
    pauseProgress=currentAnimProgress();
    paused=true;
    pausedAt=performance.now();
    clearTimeout(timer); stopTechno(); pauseBtn.textContent='▶';
  }
  overlayTitle.textContent='RANKING';
  overlayText.textContent='';
  renderRanking();
  rankbox.style.display='block';
  overlay.classList.remove('hidden');
}

function updateHud(){
  levelEl.textContent=level;
  countEl.textContent=soldiers.length;
  scoreEl.textContent=score;
}

function setDirection(name){
  const map={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
  const d=map[name];
  if(!d || !running || paused) return;

  // Validate against the last planned direction, so fast two-step inputs are accepted safely.
  const base=turnQueue.length ? turnQueue[turnQueue.length-1] : dir;
  if(d.x===-base.x && d.y===-base.y) return;
  if(d.x===base.x && d.y===base.y) return;

  if(turnQueue.length<2){
    turnQueue.push(d);
    queuedDir=d;
  }

  // A valid late turn during the grace window rescues the run immediately.
  if(collisionPending){
    collisionPending=false;
    if(collisionTimer){ clearTimeout(collisionTimer); collisionTimer=null; }
    clearTimeout(timer);
    timer=setTimeout(tick,0);
  }
}

function drawArmyMan(cellX,cellY,isHead=false,isRecruit=false){
  const c=canvas.width/N;
  const x=cellX*c, y=cellY*c;
  ctx.save();
  ctx.translate(x,y);

  const main=isRecruit?'#87372c':(isHead?'#274f21':'#3f7133');
  const mid=isRecruit?'#69291f':'#315b29';
  const light=isRecruit?'#b35b4c':'#75a263';
  const hi=isRecruit?'#d47a68':'#9cc28b';
  const dark=isRecruit?'#421a15':'#172d16';

  // cast shadow
  ctx.fillStyle='rgba(20,30,16,.22)';
  ctx.beginPath(); ctx.ellipse(c*.52,c*.91,c*.34,c*.075,0,0,Math.PI*2); ctx.fill();

  // molded display base
  ctx.fillStyle=dark;
  ctx.beginPath(); ctx.ellipse(c*.50,c*.875,c*.34,c*.075,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=mid;
  ctx.beginPath(); ctx.ellipse(c*.50,c*.855,c*.29,c*.047,0,0,Math.PI*2); ctx.fill();

  // combat boots
  ctx.fillStyle=dark;
  ctx.beginPath();
  ctx.roundRect(c*.27,c*.77,c*.22,c*.105,c*.035); ctx.fill();
  ctx.beginPath();
  ctx.roundRect(c*.53,c*.77,c*.22,c*.105,c*.035); ctx.fill();

  // legs with stance
  ctx.fillStyle=main;
  ctx.beginPath();
  ctx.moveTo(c*.34,c*.54);ctx.lineTo(c*.49,c*.54);ctx.lineTo(c*.46,c*.79);ctx.lineTo(c*.31,c*.79);ctx.closePath();ctx.fill();
  ctx.beginPath();
  ctx.moveTo(c*.53,c*.54);ctx.lineTo(c*.67,c*.54);ctx.lineTo(c*.71,c*.79);ctx.lineTo(c*.56,c*.79);ctx.closePath();ctx.fill();

  // jacket / torso
  ctx.fillStyle=main;
  ctx.beginPath();
  ctx.moveTo(c*.31,c*.33);ctx.lineTo(c*.69,c*.33);ctx.lineTo(c*.66,c*.59);ctx.lineTo(c*.34,c*.59);ctx.closePath();ctx.fill();

  // chest pockets
  ctx.fillStyle=mid;
  ctx.fillRect(c*.36,c*.40,c*.105,c*.075);
  ctx.fillRect(c*.54,c*.40,c*.105,c*.075);

  // belt + buckle
  ctx.fillStyle=dark; ctx.fillRect(c*.33,c*.515,c*.34,c*.055);
  ctx.fillStyle=hi; ctx.fillRect(c*.475,c*.518,c*.065,c*.045);

  // collar
  ctx.fillStyle=dark;
  ctx.beginPath();ctx.moveTo(c*.43,c*.33);ctx.lineTo(c*.50,c*.40);ctx.lineTo(c*.57,c*.33);ctx.closePath();ctx.fill();

  // neck and head
  ctx.fillStyle=mid;ctx.fillRect(c*.45,c*.265,c*.10,c*.075);
  ctx.fillStyle=main;
  ctx.beginPath();ctx.arc(c*.50,c*.225,c*.105,0,Math.PI*2);ctx.fill();

  // jaw / face detail
  ctx.strokeStyle=dark;ctx.lineWidth=Math.max(1.5,c*.022);
  ctx.beginPath();ctx.moveTo(c*.44,c*.265);ctx.lineTo(c*.50,c*.285);ctx.lineTo(c*.57,c*.26);ctx.stroke();
  ctx.fillStyle=dark;
  ctx.fillRect(c*.545,c*.215,c*.05,c*.025);

  // steel-style helmet, still molded plastic
  ctx.fillStyle=light;
  ctx.beginPath();ctx.arc(c*.50,c*.175,c*.17,Math.PI,Math.PI*2);ctx.fill();
  ctx.beginPath();
  ctx.ellipse(c*.50,c*.19,c*.20,c*.045,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=hi;
  ctx.beginPath();ctx.arc(c*.46,c*.145,c*.065,Math.PI*1.05,Math.PI*1.75);ctx.strokeStyle=hi;ctx.lineWidth=c*.025;ctx.stroke();

  // arms in active rifle pose
  ctx.strokeStyle=main;ctx.lineWidth=Math.max(4,c*.085);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(c*.34,c*.37);ctx.lineTo(c*.22,c*.49);ctx.lineTo(c*.35,c*.56);ctx.stroke();
  ctx.beginPath();ctx.moveTo(c*.66,c*.37);ctx.lineTo(c*.76,c*.46);ctx.lineTo(c*.63,c*.52);ctx.stroke();

  // hands
  ctx.fillStyle=mid;
  ctx.beginPath();ctx.arc(c*.35,c*.55,c*.055,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(c*.64,c*.51,c*.052,0,Math.PI*2);ctx.fill();

  // rifle: stock, receiver, barrel and sight
  ctx.strokeStyle=dark;ctx.lineWidth=Math.max(3,c*.055);
  ctx.beginPath();ctx.moveTo(c*.25,c*.59);ctx.lineTo(c*.82,c*.30);ctx.stroke();
  ctx.fillStyle=dark;
  ctx.beginPath();
  ctx.moveTo(c*.23,c*.57);ctx.lineTo(c*.35,c*.51);ctx.lineTo(c*.39,c*.57);ctx.lineTo(c*.29,c*.63);ctx.closePath();ctx.fill();
  ctx.fillRect(c*.54,c*.425,c*.18,c*.07);
  ctx.fillRect(c*.72,c*.335,c*.16,c*.045);
  ctx.fillRect(c*.82,c*.285,c*.025,c*.065);

  // molded highlights to give plastic depth
  ctx.fillStyle='rgba(255,255,255,.20)';
  ctx.fillRect(c*.37,c*.355,c*.035,c*.12);
  ctx.fillRect(c*.365,c*.60,c*.028,c*.13);
  ctx.fillRect(c*.575,c*.60,c*.025,c*.13);

  // leader gets a tiny shoulder mark for readability
  if(isHead && !isRecruit){
    ctx.fillStyle='#b8cf91';
    ctx.fillRect(c*.30,c*.335,c*.10,c*.035);
  }

  ctx.restore();
}

function lerp(a,b,t){ return a+(b-a)*t; }

function smoothStep(t){
  return t*t*(3-2*t);
}

function draw(over=false){
  const cell=canvas.width/N;
  ctx.fillStyle='#dce4c7';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='#c0c9aa';ctx.lineWidth=1;
  for(let i=0;i<=N;i++){
    const p=i*cell;
    ctx.beginPath();ctx.moveTo(p,0);ctx.lineTo(p,canvas.height);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,p);ctx.lineTo(canvas.width,p);ctx.stroke();
  }

  if(recruit) drawArmyMan(recruit.x,recruit.y,false,true);

  let p;
  if(paused) p=pauseProgress;
  else if(!running) p=1;
  else p=Math.max(0,Math.min(1,(performance.now()-animationStart)/animationDuration));
  p=smoothStep(p);

  soldiers.slice().reverse().forEach((s,ri)=>{
    const i=soldiers.length-1-ri;
    const origin=prevSoldiers[Math.min(i,Math.max(0,prevSoldiers.length-1))] || s;
    const px=lerp(origin.x,s.x,p);
    const py=lerp(origin.y,s.y,p);
    drawArmyMan(px,py,i===0,false);
  });

  if(over){ctx.fillStyle='#18201455';ctx.fillRect(0,0,canvas.width,canvas.height);}
}

function renderLoop(){
  draw(!running && overlayTitle.textContent==='GAME OVER');
  requestAnimationFrame(renderLoop);
}
requestAnimationFrame(renderLoop);

overlay.addEventListener('pointerdown',e=>{
  e.preventDefault();
  audioReady();
  if(showingRanking){
    showingRanking=false;
    rankbox.style.display='none';
    if(running){
      paused=false; pauseBtn.textContent='Ⅱ'; overlay.classList.add('hidden');
      const remaining=Math.max(0, animationDuration*(1-pauseProgress));
      animationStart=performance.now()-pauseProgress*animationDuration;
      schedule(remaining);
    }else{
      overlayTitle.textContent='TAP TO START'; overlayText.textContent='';
    }
    return;
  }
  if(paused&&running){
    paused=false; pauseBtn.textContent='Ⅱ'; overlay.classList.add('hidden');
    const remaining=Math.max(0, animationDuration*(1-pauseProgress));
    animationStart=performance.now()-pauseProgress*animationDuration;
    schedule(remaining);
    return;
  }
  if(!running) resetGame();
});

document.getElementById('restart').addEventListener('pointerdown',e=>{e.preventDefault();resetGame();});
document.getElementById('pause').addEventListener('pointerdown',e=>{e.preventDefault();togglePause();});
document.getElementById('ranking').addEventListener('pointerdown',e=>{e.preventDefault();showRanking();});

let lastDirectionInput=0;
function pressDirection(btn,e){
  if(e) e.preventDefault();
  const now=performance.now();
  if(now-lastDirectionInput<30) return;
  lastDirectionInput=now;
  audioReady();
  btn.classList.add('pressed');
  setTimeout(()=>btn.classList.remove('pressed'),100);
  setDirection(btn.dataset.dir);
}

document.querySelectorAll('[data-dir]').forEach(btn=>{
  btn.addEventListener('pointerdown',e=>pressDirection(btn,e),{passive:false});
  btn.addEventListener('touchstart',e=>pressDirection(btn,e),{passive:false});
});

soundBtn.addEventListener('pointerdown',e=>{
  e.preventDefault();
  soundOn=!soundOn;
  soundBtn.textContent=soundOn?'♪ ON':'♪ OFF';
  if(soundOn){
    audioReady();
    tone(440,.05,'square',.025);
    if(running&&!paused) startTechno();
  }else{
    stopTechno();
  }
});

window.addEventListener('keydown',e=>{
  const keyMap={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
  if(keyMap[e.key]){e.preventDefault();setDirection(keyMap[e.key]);}
  if(e.key==='p'||e.key==='P'){e.preventDefault();togglePause();}
});

let sx=0,sy=0;
canvas.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;audioReady();});
canvas.addEventListener('pointerup',e=>{
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;
  setDirection(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));
});

draw();
})();
</script>
